[plugin]
name = "tightship"
description = "Skills, a command per step of the development loop, and a read-only verifier"
author = "ATNexusLab"
repository = "https://github.com/ATNexusLab/tightship"

[references]
skill = "{plugin}:{name}"
command = "/{plugin}:{name}"
agent = "{plugin}:{name}"

[access]
read-only = "Read, Grep, Glob, Bash"

[contract]
limit = 10000

[capabilities]
arguments = "$ARGUMENTS"
plan-mode = "plan mode"
plan-approval = "`ExitPlanMode`"
explore-agent = "the **Explore** agent"
general-agent = "`general-purpose` subagent"
review-command = "`/code-review`"
security-review-command = "`/security-review`"
harness-instructions-file = "`CLAUDE.md`"
area-instructions = "Claude Code loads an area's file when it works there"
skill-tool = "the Skill tool"
instruction-files-precedence = "A `CLAUDE.md` or `CLAUDE.local.md` in a directory, or any directory above it, stops Claude Code from reading the `AGENTS.md` there"
instruction-files-search = "`find . -name AGENTS.md -o -name CLAUDE.md -o -name CLAUDE.local.md`"
instruction-files-migration = "A `CLAUDE.md` or `CLAUDE.local.md` in a directory, or above it, stops Claude Code from reading the `AGENTS.md` there, so each `CLAUDE.md`'s content moves into the `AGENTS.md` of the same directory and the `CLAUDE.md` is removed. A `CLAUDE.local.md` is personal and uncommitted: I ask whether its rules belong in the repo before touching it."

[neutrality]
names = ["Claude Code", "Claude", "Anthropic"]
paths = [
  ".claude/",
  "~/.claude",
  "CLAUDE.md",
  "CLAUDE.local.md",
  "CLAUDE_PLUGIN_ROOT",
  "CLAUDE_PLUGIN_DATA",
  "CLAUDE_PROJECT_DIR",
]
tools = [
  "Skill tool",
  "Agent tool",
  "Task tool",
  "AskUserQuestion",
  "ExitPlanMode",
  "EnterPlanMode",
  "TodoWrite",
  "WebFetch",
  "WebSearch",
  "Explore",
  "general-purpose",
  "/code-review",
  "/security-review",
  "$ARGUMENTS",
]

[[companions]]
plugin = "ponytail"
marketplace = "ponytail"

[[companions]]
plugin = "i-have-adhd"
marketplace = "i-have-adhd"

[[companions]]
plugin = "humanizer"
marketplace = "humanizer"
