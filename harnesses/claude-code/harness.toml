[plugin]
name = "tightship"
description = "Skills, a command per step of the development loop, and a read-only verifier"
author = "ATNexusLab"
repository = "https://github.com/ATNexusLab/tightship"
license = "MIT"

[dist]
manifest = ".claude-plugin/plugin.json"
catalog = ".claude-plugin/marketplace.json"
try-it = "claude --plugin-dir dist/claude-code"

[install]
label = "Claude Code"
command = "claude"
min-version = "2.1.295"
aliases = ["claude"]

[references]
skill = "{plugin}:{name}"
command = "/{plugin}:{name}"
agent = "{plugin}:{name}"
option = "${user_config.{name}}"

[access]
read-only = "Read, Grep, Glob, Bash"

[contract]
limit = 10000

[capabilities]
arguments = "$ARGUMENTS"
plan-mode = "plan mode"
plan-approval = "`ExitPlanMode`"
explore-agent = "the **Explore** agent"
general-agent = "`general-purpose` subagent"
review-command = "`/code-review`"
security-review-command = "`/security-review`"
harness-instructions-file = "`CLAUDE.md`"
area-instructions = "Claude Code loads an area's file when it works there"
skill-tool = "the Skill tool"
instruction-files-precedence = "A `CLAUDE.md` or `CLAUDE.local.md` in a directory, or any directory above it, stops Claude Code from reading the `AGENTS.md` there"
instruction-files-search = "`find . -name AGENTS.md -o -name CLAUDE.md -o -name CLAUDE.local.md`"
instruction-files-migration = "A `CLAUDE.md` or `CLAUDE.local.md` in a directory, or above it, stops Claude Code from reading the `AGENTS.md` there, so each `CLAUDE.md`'s content moves into the `AGENTS.md` of the same directory and the `CLAUDE.md` is removed. A `CLAUDE.local.md` is personal and uncommitted: I ask whether its rules belong in the repo before touching it."
project-skills-folder = "`.agents/skills/`"
project-skill-pointer = "For each project skill, `.claude/skills/<name>/SKILL.md` with the same `name` and `description`, a `# <name>` heading, and the line: Read `.agents/skills/<name>/SKILL.md` and follow it. Claude Code reads no `.agents/skills/`."

[neutrality]
names = ["Claude Code", "Claude", "Anthropic"]
paths = [
  ".claude/",
  "~/.claude",
  "CLAUDE.md",
  "CLAUDE.local.md",
  "CLAUDE_PLUGIN_ROOT",
  "CLAUDE_PLUGIN_DATA",
  "CLAUDE_PROJECT_DIR",
  "${user_config",
]
tools = [
  "Skill tool",
  "Agent tool",
  "Task tool",
  "AskUserQuestion",
  "ExitPlanMode",
  "EnterPlanMode",
  "TodoWrite",
  "WebFetch",
  "WebSearch",
  "Explore",
  "general-purpose",
  "/code-review",
  "/security-review",
  "$ARGUMENTS",
]

[clean]
names = ["ponytail", "i-have-adhd", "humanizer"]
previous-versions = true
paths = [
  { path = "{config}/plugins/cache/ponytail/" },
  { path = "{config}/plugins/marketplaces/ponytail/" },
  { path = "{config}/plugins/data/ponytail-ponytail/" },
  { path = "{config}/plugins/cache/i-have-adhd/" },
  { path = "{config}/plugins/marketplaces/i-have-adhd/" },
  { path = "{config}/plugins/data/i-have-adhd-i-have-adhd/" },
  { path = "{config}/plugins/cache/humanizer/" },
  { path = "{config}/plugins/marketplaces/humanizer/" },
  { path = "{config}/plugins/data/humanizer-humanizer/" },
  { path = "{config}/.ponytail-active" },
  { path = "{config}/ponytail-modes/" },
  { path = "{config}/ponytail-statusline.sh" },
  { path = "{config}/ponytail-statusline.ps1" },
  { path = "{config}/.ponytail-statusline-nudged" },
  { path = "{config}/.ponytail-band" },
  { path = "{config}/.i-have-adhd-always" },
  { path = "~/.config/ponytail/" },
  { path = "{config}/plugins/data/tightship-tightship/checkpoints/" },
]
json = [
  { file = "{config}/settings.json", remove = "/enabledPlugins/ponytail@ponytail" },
  { file = "{config}/settings.json", remove = "/extraKnownMarketplaces/ponytail" },
  { file = "{config}/settings.json", remove = "/enabledPlugins/i-have-adhd@i-have-adhd" },
  { file = "{config}/settings.json", remove = "/extraKnownMarketplaces/i-have-adhd" },
  { file = "{config}/settings.json", remove = "/enabledPlugins/humanizer@humanizer" },
  { file = "{config}/settings.json", remove = "/extraKnownMarketplaces/humanizer" },
]
status-line = [{ contains = "ponytail-statusline" }]
commands = [
  { when = "{config}/plugins/cache/ponytail/", run = "claude plugin uninstall ponytail@ponytail" },
  { when = "{config}/plugins/marketplaces/ponytail/", run = "claude plugin marketplace remove ponytail" },
  { when = "{config}/plugins/cache/i-have-adhd/", run = "claude plugin uninstall i-have-adhd@i-have-adhd" },
  { when = "{config}/plugins/marketplaces/i-have-adhd/", run = "claude plugin marketplace remove i-have-adhd" },
  { when = "{config}/plugins/cache/humanizer/", run = "claude plugin uninstall humanizer@humanizer" },
  { when = "{config}/plugins/marketplaces/humanizer/", run = "claude plugin marketplace remove humanizer" },
]
