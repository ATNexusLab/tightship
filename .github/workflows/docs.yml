name: Docs

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "**.md"
      - docs/**
      - zensical.toml
      - .markdownlint-cli2.jsonc
      - .github/workflows/docs.yml

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: markdownlint
        run: npx markdownlint-cli2@0.23.3

      - name: astral-sh/setup-uv v10.3.0
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: zensical build
        run: uvx zensical==0.0.70 build
