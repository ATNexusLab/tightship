name: Scan

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          folder="$RUNNER_TEMP/gitleaks"
          mkdir -p "$folder"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C "$folder"
          echo "$folder" >> "$GITHUB_PATH"

      - name: cargo xtask scan
        run: cargo xtask scan
