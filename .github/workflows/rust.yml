name: Rust

on:
  pull_request:
    branches: [develop, main]
    paths:
      - xtask/**
      - tightship/**
      - content/**
      - harnesses/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/rust.yml

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      USER: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install gitleaks 8.30.1
        run: |
          case "$RUNNER_OS" in
          Linux) asset=gitleaks_8.30.1_linux_x64.tar.gz ;;
          macOS) asset=gitleaks_8.30.1_darwin_arm64.tar.gz ;;
          Windows) asset=gitleaks_8.30.1_windows_x64.zip ;;
          esac
          folder="$RUNNER_TEMP/gitleaks"
          mkdir -p "$folder"
          curl -fsSL -o "$folder/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          case "$asset" in
          *.zip) unzip -q "$folder/$asset" -d "$folder" ;;
          *) tar -xzf "$folder/$asset" -C "$folder" ;;
          esac
          echo "$folder" >> "$GITHUB_PATH"

      - name: Set the git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write .identity-terms
        env:
          IDENTITY_TERMS: ${{ secrets.IDENTITY_TERMS }}
        run: |
          [ -z "$IDENTITY_TERMS" ] || printf '%s\n' "$IDENTITY_TERMS" > .identity-terms

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo xtask build
        run: cargo xtask build

      - name: cargo test
        run: cargo test --workspace --no-fail-fast
