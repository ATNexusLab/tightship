name: Rust

on:
  pull_request:
    branches: [develop, main]
    paths:
      - xtask/**
      - tightship/**
      - content/**
      - harnesses/**
      - installer/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/rust.yml

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      content: ${{ steps.paths.outputs.content }}
    steps:
      - name: Sort the changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          code=false
          content=false
          while IFS= read -r path; do
            case "$path" in
            xtask/* | tightship/* | installer/* | harnesses/* | Cargo.toml | Cargo.lock | rust-toolchain.toml \
              | .github/workflows/rust.yml) code=true ;;
            content/*) content=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"
          echo "code: $code, content: $content"

  content:
    needs: changes
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    env:
      USER: ""
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install gitleaks 8.30.1
        run: |
          folder="$RUNNER_TEMP/gitleaks"
          mkdir -p "$folder"
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$folder/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          (cd "$folder" && echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $asset" | sha256sum -c -)
          tar -xzf "$folder/$asset" -C "$folder"
          echo "$folder" >> "$GITHUB_PATH"

      - name: Set the git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write .identity-terms
        env:
          IDENTITY_TERMS: ${{ secrets.IDENTITY_TERMS }}
        run: |
          [ -z "$IDENTITY_TERMS" ] || printf '%s\n' "$IDENTITY_TERMS" > .identity-terms

      - name: cargo xtask build
        run: cargo xtask build

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  gates:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      USER: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install gitleaks 8.30.1
        run: |
          case "$RUNNER_OS" in
          Linux)
            asset=gitleaks_8.30.1_linux_x64.tar.gz
            checksum=sha256sum
            sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
            ;;
          macOS)
            asset=gitleaks_8.30.1_darwin_arm64.tar.gz
            checksum="shasum -a 256"
            sha256=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
            ;;
          Windows)
            asset=gitleaks_8.30.1_windows_x64.zip
            checksum=sha256sum
            sha256=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
            ;;
          esac
          folder="$RUNNER_TEMP/gitleaks"
          mkdir -p "$folder"
          curl -fsSL -o "$folder/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          (cd "$folder" && echo "$sha256  $asset" | $checksum -c -)
          case "$asset" in
          *.zip) unzip -q "$folder/$asset" -d "$folder" ;;
          *) tar -xzf "$folder/$asset" -C "$folder" ;;
          esac
          echo "$folder" >> "$GITHUB_PATH"

      - name: Set the git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write .identity-terms
        env:
          IDENTITY_TERMS: ${{ secrets.IDENTITY_TERMS }}
        run: |
          [ -z "$IDENTITY_TERMS" ] || printf '%s\n' "$IDENTITY_TERMS" > .identity-terms

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo xtask build
        run: cargo xtask build

      - name: cargo test
        run: cargo test --workspace --no-fail-fast
